experiment: lab6-fashion-mnist
run_name: resume-part1
seed: 42
data:
  root: data
  val_size: 5000
  batch_size: 128
  num_workers: 4
train:
  epochs: 6
  device: cpu
  optimizer: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0
  scheduler: cosine
  step_size: 3
  gamma: 0.1
  patience: 1
  accum_steps: 1
  stop_after_epoch: 3
checkpoint:
  dir: checkpoints
  resume: null
mlflow:
  log_checkpoint: true
