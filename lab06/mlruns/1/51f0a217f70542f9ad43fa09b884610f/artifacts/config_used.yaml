experiment: lab6-fashion-mnist
run_name: accum-bs64x4
seed: 42
data:
  root: data
  val_size: 5000
  batch_size: 64
  num_workers: 4
train:
  epochs: 10
  device: cpu
  optimizer: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0
  scheduler: none
  step_size: 3
  gamma: 0.1
  patience: 1
  accum_steps: 4
  stop_after_epoch: null
checkpoint:
  dir: checkpoints
  resume: null
mlflow:
  log_checkpoint: true
