experiment: lab6-fashion-mnist
run_name: baseline
seed: 42

data:
  root: data
  val_size: 5000
  batch_size: 128
  num_workers: 0

train:
  epochs: 5
  device: cpu
  optimizer: adam        # adam | sgd
  lr: 0.001
  momentum: 0.9          # used by sgd
  weight_decay: 0.0
  scheduler: none        # none | step | cosine | plateau
  step_size: 3           # step scheduler
  gamma: 0.1             # step and plateau scheduler
  patience: 1            # plateau scheduler
  accum_steps: 1         # gradient accumulation (Step 6)
  stop_after_epoch: null # simulate an interruption (Step 7)

checkpoint:
  dir: checkpoints
  resume: null           # path to a checkpoint to resume from (Step 7)

mlflow:
  log_checkpoint: true